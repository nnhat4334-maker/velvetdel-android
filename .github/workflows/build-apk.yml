name: Build VELVETDEL APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Kiem tra va giai nen file ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "Cac tep trong repository:"
          ls -lah
          if [[ -f app.zip ]]; then
            ZIP=app.zip
          elif [[ -f VELVETDEL_Android_Source.zip ]]; then
            ZIP=VELVETDEL_Android_Source.zip
          else
            echo "LOI: Khong tim thay app.zip hoac VELVETDEL_Android_Source.zip tai thu muc goc."
            exit 1
          fi
          echo "Dang giai nen: $ZIP"
          unzip -tq "$ZIP"
          unzip -oq "$ZIP"
          if [[ ! -f VELVETDEL-Android/settings.gradle ]]; then
            echo "LOI: ZIP khong co thu muc VELVETDEL-Android/settings.gradle nhu du kien."
            exit 1
          fi

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cai Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Cai Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tao APK Debug
        run: gradle -p VELVETDEL-Android :app:assembleDebug --no-daemon --stacktrace

      - name: Dang tai APK
        uses: actions/upload-artifact@v4
        with:
          name: VELVETDEL-debug-apk
          path: VELVETDEL-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
