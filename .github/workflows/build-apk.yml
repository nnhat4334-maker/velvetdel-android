
name: Build VELVETDEL APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: unzip -q VELVETDEL_Android_Source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle -p VELVETDEL-Android :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VELVETDEL-debug-apk
          path: VELVETDEL-Android/app/build/outputs/apk/debug/app-debug.apk
